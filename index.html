<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Spelling Dragon Battle</title>

<style>
body{
  font-family:"Arial Rounded MT Bold",Arial,sans-serif;
  background:linear-gradient(#dff3ff,#ffffff);
  text-align:center;
  margin:0;
  padding:12px;
}

h1{font-size:42px;color:#2b6cb0;margin:10px 0;}
.level{font-size:30px;}
.dragon{font-size:100px;margin:10px 0;}

.hp-bar{
  width:340px;height:28px;
  background:#ddd;border-radius:20px;
  margin:12px auto;overflow:hidden;
}
#hpFill{
  height:100%;width:0%;
  background:linear-gradient(to right,#4caf50,#8bc34a);
  transition:.3s;
}

.listen-btn{
  font-size:42px;
  padding:28px 64px;
  margin:10px;
  border-radius:32px;
  background:#ff9800;
  color:white;border:none;
}
.hint-btn{
  font-size:30px;
  padding:18px 40px;
  margin:10px;
  border-radius:26px;
  background:#9c27b0;
  color:white;border:none;
}
.hint-btn:disabled{
  background:#ccc;
}

#hint{
  font-size:40px;
  height:46px;
  color:#444;
}
#hintCount{
  font-size:22px;
  color:#555;
}

.progress{
  font-size:42px;
  color:#2e7d32;
  min-height:48px;
}

.buttons button{
  font-size:52px;
  width:120px;height:120px;
  margin:10px;
  border-radius:30px;
  border:none;
  background:#4cafef;
  color:white;
  box-shadow:0 5px 0 #2196f3;
}
.buttons button:active{
  transform:translateY(5px);
  box-shadow:none;
}

#stickerArea{
  display:flex;flex-wrap:wrap;
  justify-content:center;
  gap:14px;margin-top:14px;
}
#stickerArea img{
  width:100px;border-radius:16px;
  box-shadow:0 4px 8px rgba(0,0,0,.25);
}

#modal{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.7);
  justify-content:center;align-items:center;
  z-index:2000;
}
#modal img{
  width:380px;
  background:white;
  border-radius:26px;
  padding:14px;
}

#levelUpEffect,
#completeEffect{
  display:none;
  position:fixed;inset:0;
  background:rgba(255,255,255,.95);
  z-index:5000;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}
.bigText{
  font-size:56px;
  color:#ff9800;
  font-weight:bold;
}
.sparkles{
  font-size:48px;
  margin-top:12px;
}

#resetArea{margin-top:30px;padding-bottom:20px;}
#resetBtn{
  font-size:20px;
  padding:14px 30px;
  border-radius:18px;
  background:#dddddd;
  color:#333;border:none;
}
#resetHint{font-size:14px;color:#666;margin-top:6px;}
</style>
</head>

<body>

<h1>🐉 スペリング ドラゴンバトル</h1>
<div class="level">LEVEL <span id="level">1</span></div>
<div class="dragon">🐲</div>

<div class="hp-bar"><div id="hpFill"></div></div>

<button class="listen-btn" onclick="speakWord()">🔊 きく</button>
<button id="hintBtn" class="hint-btn" onclick="showHint()">💡 HINT</button>
<div id="hintCount">HINT のこり 3</div>

<div id="hint"></div>
<div class="progress" id="progress"></div>
<div class="buttons" id="buttons"></div>

<h2>🎁 ステッカー</h2>
<div id="stickerArea"></div>

<div id="modal" onclick="closeModal()">
  <img id="modalImg">
</div>

<div id="levelUpEffect">
  <div class="bigText">LEVEL UP!! ⭐</div>
  <div class="sparkles">✨ ⭐ ✨ ⭐ ✨</div>
</div>

<div id="completeEffect">
  <div class="bigText">🎉 COMPLETE!! 🎉</div>
  <div class="sparkles">30まい あつめたよ！</div>
</div>

<div id="resetArea">
  <button id="resetBtn"
    ontouchstart="startReset()"
    ontouchend="cancelReset()"
    onmousedown="startReset()"
    onmouseup="cancelReset()"
    onmouseleave="cancelReset()">
    🔄 さいしょから
  </button>
  <div id="resetHint">※3びょう ながおし</div>
</div>

<script>
const STICKER_COUNT = 30;
let unusedStickers = [...Array(STICKER_COUNT).keys()].map(i=>i+1);

const hitSound  = new Audio("hit.mp3");
const missSound = new Audio("miss.mp3");
const deadSound = new Audio("dead.mp3");

window.speechSynthesis.onvoiceschanged = ()=>speechSynthesis.getVoices();

/* ===== 単語（省略：前回と同じ配列をここに入れてください） ===== */
let words = [
  "THE","A","DO","TO","OF","SAID","SAYS","YOU","YOUR","THEY","BE","ME","HE","SHE","WE","NO",
  "COME","SOME","ONE","ONCE","ASK","FRIEND","SCHOOL","PUT","ARE","WERE","WAS","HIS","HAS","I",
  "GO","SO","BY","MY","HERE","THERE","WHERE","LOVE","PUSH","PULL","HOUSE","FULL","OUR","DOOR",
  "POOR","FIND","MIND","FLOOR","BECAUSE","KIND","BEHIND","WHOLE","WHY","ANY","CHILD","CHILDREN",
  "CLIMB","ONLY","OLD","MANY","CLOTHES","COLD","GOLD","HOLD","TOLD","EVERY","GREAT","BREAK",
  "STEAK","BUSY","PEOPLE","PRETTY","BEAUTIFUL","AFTER","FAST","LAST","PAST","FATHER","CLASS",
  "WATER","AGAIN","GRASS","PASS","PLANT","PATH","BATH","HOUR","MOVE","PROVE","HALF","MONEY",
  "IMPROVE","SUGAR","COULD","WOULD","SURE","EYE","SHOULD","WHO","MR","MRS","PARENTS",
  "CHRISTMAS","EVERYBODY","EVEN"
];

let level=1;
let levelWords=[],qIndex=0;
let currentWord="",charIndex=0;
let hintLeft=3;

/* ===== 読み上げ ===== */
function speakWord(){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(currentWord);
  u.rate=0.9;
  const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith("en-GB"))
        || speechSynthesis.getVoices().find(v=>v.lang.startsWith("en-US"));
  if(v){u.voice=v;u.lang=v.lang;}
  speechSynthesis.speak(u);
}

/* ===== HINT ===== */
function showHint(){
  if(hintLeft<=0) return;
  hintLeft--;
  document.getElementById("hint").textContent=currentWord;
  document.getElementById("hintCount").textContent="HINT のこり "+hintLeft;
  if(hintLeft===0) document.getElementById("hintBtn").disabled=true;
  setTimeout(()=>document.getElementById("hint").textContent="",400);
}

/* ===== ゲーム進行 ===== */
function startLevel(){
  levelWords=[...words].sort(()=>Math.random()-0.5).slice(0,10);
  qIndex=0;
  startQuestion();
}
function startQuestion(){
  currentWord=levelWords[qIndex];
  charIndex=0;
  hintLeft=3;
  document.getElementById("hintBtn").disabled=false;
  document.getElementById("hintCount").textContent="HINT のこり 3";
  document.getElementById("progress").textContent="";
  updateProgress();
  createButtons();
  setTimeout(speakWord,500);
}

/* ===== ボタン ===== */
function createButtons(){
  const area=document.getElementById("buttons");
  area.innerHTML="";
  let letters=currentWord.split("");
  while(letters.length<8){
    const c=String.fromCharCode(65+Math.floor(Math.random()*26));
    if(!letters.includes(c)) letters.push(c);
  }
  letters.sort(()=>Math.random()-0.5);
  letters.forEach(l=>{
    const b=document.createElement("button");
    b.textContent=l;
    b.onclick=()=>tapLetter(l);
    area.appendChild(b);
  });
}

/* ===== 判定 ===== */
function tapLetter(l){
  if(l===currentWord[charIndex]){
    hitSound.play();
    charIndex++;
    document.getElementById("progress").textContent=currentWord.slice(0,charIndex);
    if(charIndex===currentWord.length){
      qIndex++;
      updateProgress();
      if(qIndex>=10){
        deadSound.play();
        levelUp();
      }else startQuestion();
    }
  }else{
    missSound.play();
  }
}

function updateProgress(){
  document.getElementById("hpFill").style.width=(qIndex/10*100)+"%";
}

/* ===== レベルアップ & ステッカー ===== */
function levelUp(){
  level++;
  document.getElementById("level").textContent=level;

  if(unusedStickers.length>0){
    const i=Math.floor(Math.random()*unusedStickers.length);
    addSticker(unusedStickers.splice(i,1)[0]);
  }

  document.getElementById("levelUpEffect").style.display="flex";
  setTimeout(()=>document.getElementById("levelUpEffect").style.display="none",1200);

  if(unusedStickers.length===0){
    document.getElementById("completeEffect").style.display="flex";
  }

  setTimeout(startLevel,1500);
}

function addSticker(n){
  const img=document.createElement("img");
  img.src=`volst (${n}).png`;
  img.onclick=()=>openModal(img.src);
  document.getElementById("stickerArea").appendChild(img);
}

function openModal(src){
  document.getElementById("modalImg").src=src;
  document.getElementById("modal").style.display="flex";
}
function closeModal(){
  document.getElementById("modal").style.display="none";
}

/* ===== リセット ===== */
let resetTimer=null;
function startReset(){resetTimer=setTimeout(resetAll,3000);}
function cancelReset(){if(resetTimer){clearTimeout(resetTimer);resetTimer=null;}}
function resetAll(){
  cancelReset();
  if(confirm("さいしょから やりなおしますか？")){
    location.reload();
  }
}

/* ===== 開始 ===== */
startLevel();
</script>

</body>
</html>
